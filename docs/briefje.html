<!doctype html>
<html lang="nl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Afdrukbare deelnemersbriefjes voor de Live Diabetes Quiz.">
    <title>Deelnemersbriefjes – Live Diabetes Quiz</title>
    <link rel="stylesheet" href="assets/styles.css?v=9">
</head>
<body class="handout-page">
    <header class="site-header no-print">
        <div class="site-header__inner">
            <a class="brand" href="quizmaster.html">
                <img class="brand__logo" src="assets/logo-diabetes-liga-midden-limburg.png" alt="">
                <span>Deelnemersbriefjes</span>
            </a>
            <span class="badge">Twee briefjes per A4</span>
        </div>
    </header>

    <main class="handout-shell">
        <section class="panel handout-controls no-print">
            <p class="eyebrow">Vooraf voorbereiden</p>
            <h1>Deelnemersbriefjes afdrukken</h1>
            <p class="lead">
                Vul eventueel de wifi van de zaal in. De QR-code, internetlink en
                driecijferige quizcode staan daarna op ieder briefje.
            </p>
            <div class="form-row" style="margin-top: 1.5rem">
                <div class="field">
                    <label for="wifiName">Naam wifi van de zaal</label>
                    <input id="wifiName" type="text" placeholder="Bijvoorbeeld: Zaal_Gasten">
                </div>
                <div class="field">
                    <label for="wifiPassword">Wachtwoord wifi</label>
                    <input id="wifiPassword" type="text" placeholder="Laat leeg als dit niet nodig is">
                </div>
            </div>
            <div class="button-row">
                <button id="printButton" class="button-primary" type="button">Nu afdrukken</button>
                <a class="button-link" href="quizmaster.html">Terug naar quizmaster</a>
            </div>
            <p id="handoutError" class="notice notice--error hide" role="alert"></p>
        </section>

        <section id="handoutSheets" class="handout-sheets" aria-label="Afdrukvoorbeeld">
            <article class="participant-handout">
                <div class="participant-handout__content"></div>
            </article>
            <article class="participant-handout">
                <div class="participant-handout__content"></div>
            </article>
        </section>
    </main>

    <template id="handoutTemplate">
        <div class="handout-heading">
            <img class="brand__logo" src="assets/logo-diabetes-liga-midden-limburg.png" alt="">
            <div>
                <p class="eyebrow">Anoniem deelnemen</p>
                <h2>Live Diabetes Quiz</h2>
            </div>
        </div>
        <p class="handout-start">
            <strong>Start hier:</strong> zorg dat uw gsm verbinding heeft met internet.
            Uw eigen mobiele data aanzetten is meestal het gemakkelijkst.
        </p>
        <div class="handout-access-grid">
            <div class="handout-access-card handout-wifi-card">
                <p class="handout-access-card__number">1</p>
                <div>
                    <h3>Wifi van de zaal (alleen indien gewenst)</h3>
                    <p>Scan met uw gewone camera-app of QR-app en tik op <strong>Verbinden</strong>.</p>
                    <p class="wifi-details">Vraag indien nodig hulp aan een begeleider.</p>
                </div>
                <div class="handout-wifi-qr qr-output" aria-label="QR-code voor de wifi van de zaal"></div>
            </div>
            <div class="handout-access-card">
                <p class="handout-access-card__number">2</p>
                <div>
                    <h3>Open de quiz</h3>
                    <p>Scan deze QR-code met uw camera-app of QR-app en tik op de link.</p>
                    <p>Lukt scannen niet? Typ in de adresbalk van Google, Chrome of Safari:</p>
                    <strong class="handout-address"></strong>
                    <p>Vul indien gevraagd quizcode <strong class="handout-code"></strong> in.</p>
                </div>
                <div class="handout-quiz-qr qr-output" aria-label="QR-code naar het deelnemerscherm"></div>
            </div>
        </div>
        <p class="handout-help">Lukt het niet? Steek uw hand op. Wij helpen u graag.</p>
        <p class="handout-privacy">
            Uw naam en e-mailadres worden niet gevraagd. Laat het deelnemerscherm tijdens de quiz openstaan.
        </p>
    </template>

    <script src="assets/vendor/qrcode.min.js"></script>
    <script type="module" src="assets/briefje.js?v=5"></script>
</body>
</html>
